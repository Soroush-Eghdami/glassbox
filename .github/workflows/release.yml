# Builds glassbox-win-x64.exe + glassbox-linux-x64.tar.gz,
# attaches both to a GitHub Release. Tag like v0.1.0 to ship.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pyinstaller .
      - run: pyinstaller --onefile --console --name glassbox-win-x64 glassbox/app.py
      - uses: actions/upload-artifact@v5
        with:
          name: glassbox-win-x64
          path: dist/glassbox-win-x64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pyinstaller .
      - run: pyinstaller --onefile --console --name glassbox-linux-x64 glassbox/app.py
      - run: tar -czf glassbox-linux-x64.tar.gz -C dist glassbox-linux-x64
      - uses: actions/upload-artifact@v5
        with:
          name: glassbox-linux-x64
          path: glassbox-linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - run: gh release view ${{ github.ref_name }} -R ${{ github.repository }} >/dev/null 2>&1 || gh release create ${{ github.ref_name }} -R ${{ github.repository }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: >
          gh release upload ${{ github.ref_name }} -R ${{ github.repository }}
          artifacts/glassbox-win-x64/glassbox-win-x64.exe
          artifacts/glassbox-linux-x64/glassbox-linux-x64.tar.gz
          --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
